name: CI

permissions: {}

# Automatic triggers are deliberately switched off.
#
# GitHub Actions is blocked on this account by a billing lock, so every push queued this workflow,
# failed it in about four seconds with "The job was not started because your account is locked due
# to a billing issue", and mailed a failure notice. Twenty-three of those in one afternoon.
#
# The definition is kept — it documents exactly what CI runs, and everything in it passes locally
# (see the README) — but it only runs on demand now. To restore push/PR triggers once billing is
# sorted, put back the `push:` and `pull_request:` keys below.
#
# This does not affect the live site: GitHub Pages serves the prebuilt gh-pages branch through the
# built-in `pages build and deployment` job, which is not one of this repository's workflows and
# runs fine.
on:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes

      # The fork tests reach https://rpc.mainnet.arc.io and assert the 18/6 decimal relationship
      # against live Arc Mainnet. They are deliberately not skippable: a claim about a live chain
      # that can quietly skip itself is not a proof, so a network outage fails CI rather than
      # reporting a green suite that proved nothing.
      - run: forge test -vv

  frontend:
    name: Frontend (vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  links:
    name: No dead links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-links
