name: Publish dashboard

# Automatic triggers are deliberately switched off.
#
# GitHub Actions is blocked on this account by a billing lock, so every push queued this workflow,
# failed it in about four seconds with "The job was not started because your account is locked due
# to a billing issue", and mailed a failure notice. Twenty-three of those in one afternoon.
#
# The definition is kept — it documents exactly what CI runs, and everything in it passes locally
# (see the README) — but it only runs on demand now. To restore push/PR triggers once billing is
# sorted, put back the `push:` and `pull_request:` keys below.
#
# This does not affect the live site: GitHub Pages serves the prebuilt gh-pages branch through the
# built-in `pages build and deployment` job, which is not one of this repository's workflows and
# runs fine.
#
# npm run publish-site does the same job from a workstation and is what actually keeps the site
# current today.
on:
  workflow_dispatch:

# GitHub Pages for this repository is served from the prebuilt `gh-pages` branch rather than from
# a Pages deployment artifact. That choice is deliberate: it keeps the published bundle in the
# repository, and it means the site can be updated with `npm run publish-site` from a workstation
# when Actions is unavailable — which is exactly the situation this repository was in when the
# branch was first published.
permissions:
  contents: write

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd frontend/dist
          touch .nojekyll
          cp index.html 404.html          # Pages serves 404.html for unknown client-side routes
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish dashboard from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
